name: Build social preview image

on:
  push:
    branches: [main]
    paths:
      - "public/og-apna-ghar.svg"
      - ".github/workflows/build-og-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-og-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Render PNG and JPEG
        run: |
          magick -background none public/og-apna-ghar.svg -strip public/og-apna-ghar.png
          magick -background none public/og-apna-ghar.svg -strip -quality 92 public/og.jpg

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-apna-ghar.png public/og.jpg
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "Generate Apna Ghar social preview images"
          git push
