plugins {
    id "com.android.application"
}

def twaManifest = new groovy.json.JsonSlurper().parseText(file("../twa-manifest.json").text)

android {
    namespace twaManifest.packageId
    compileSdk 35

    defaultConfig {
        applicationId twaManifest.packageId
        minSdk twaManifest.minSdkVersion
        targetSdk 35
        versionCode twaManifest.appVersionCode
        versionName twaManifest.appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin") {
            details.useVersion "1.9.24"
        }
    }
}

dependencies {
    implementation("com.google.androidbrowserhelper:androidbrowserhelper:2.5.0") {
        exclude group: "androidx.browser", module: "browser"
    }
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
