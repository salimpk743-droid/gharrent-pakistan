plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def twaManifest = new groovy.json.JsonSlurper().parseText(file("../twa-manifest.json").text)

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(new InputStreamReader(stream, "UTF-8"))
    }
}

def uploadStoreFilePath = keystoreProperties.getProperty("storeFile")?.trim()
def uploadStorePassword = keystoreProperties.getProperty("storePassword")?.trim()
def uploadKeyAlias = keystoreProperties.getProperty("keyAlias")?.trim()
def uploadKeyPassword = keystoreProperties.getProperty("keyPassword")?.trim()
def uploadStoreFile = uploadStoreFilePath ? file(uploadStoreFilePath) : null
def hasReleaseSigning = uploadStoreFile != null &&
    uploadStoreFile.isFile() &&
    uploadStorePassword &&
    uploadKeyAlias &&
    uploadKeyPassword

android {
    namespace twaManifest.packageId
    compileSdk 36

    defaultConfig {
        applicationId twaManifest.packageId
        minSdk twaManifest.minSdkVersion
        targetSdk 36
        versionCode twaManifest.appVersionCode
        versionName twaManifest.appVersionName
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile uploadStoreFile
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin") {
            details.useVersion "1.9.24"
        }
    }
}

dependencies {
    implementation("com.google.androidbrowserhelper:androidbrowserhelper:2.6.1")
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
}
